name: Validate Data JSON
# 每次 push/PR 自动校验 data/*.json：拦截解析失败、乱码、id不符、stocks≠5 等硬伤。
# 作为本地 pre-commit 钩子的兜底，确保任何绕过钩子的提交都不会把坏数据推上 GitHub。
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all data files
        run: python validate_data.py --all
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend smoke test (home tab structure + all prediction renders)
        # 用 Node vm + 真实 data/ 渲染首页与每一期详情页,断言:
        # 三个 tab 面板是 #app 平级兄弟(防 8 月嵌套事故复发)、div 配平、无 undefined/[object Object]
        run: node scripts/smoke_test.mjs
